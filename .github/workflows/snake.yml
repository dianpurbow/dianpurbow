name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Tambahan krusial: Memaksa GitHub memberikan izin Tulis (Write)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Di-update ke v4 untuk menghilangkan warning Node.js
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: dianpurbow
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Di-update ke v4
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
